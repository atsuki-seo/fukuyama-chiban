name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Only the paths listed here are published. Everything else (plans/,
      # tools/, README.md, ...) stays in the repository only, so add new site
      # files here explicitly.
      - name: Collect the published files
        run: |
          mkdir _site
          cp -R index.html *.pmtiles search.json search fukuyama_mask.geojson fonts _site/
          cp -R manifest.webmanifest icons sw.js offline.html _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
