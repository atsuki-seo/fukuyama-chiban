<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#3a5a2a">
<title>オフライン - 福山市 地番マップ</title>
<style>
:root { --fg: #1b1b1b; --fg-sub: #4a4a4a; --bg: #ffffff; --accent: #0b57d0; }
@media (prefers-color-scheme: dark) {
  :root { --fg: #ececec; --fg-sub: #b5b5b5; --bg: #1b1b1b; --accent: #8ab4f8; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  font-size: 15px; line-height: 1.6; color: var(--fg); background: var(--bg);
  display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
}
main { max-width: 420px; text-align: center; }
h1 { font-size: 18px; margin: 16px 0 8px; }
p { margin: 0 0 8px; color: var(--fg-sub); }
button {
  margin-top: 12px; height: 44px; padding: 0 20px; border-radius: 6px; font: inherit; font-weight: 700;
  border: 1px solid var(--accent); background: var(--accent); color: var(--bg); cursor: pointer;
}
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main data-offline-page>
  <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#3a5a2a"/><path d="M4 10h12v8H4zM16 4h12v14H16zM4 18h16v10H4zM20 18h8v10h-8z" fill="none" stroke="#FFD400" stroke-width="2"/></svg>
  <h1>インターネットに接続されていません</h1>
  <p>福山市 地番マップは、地図と検索データをその都度インターネットから読み込みます。接続してから、もう一度お試しください。</p>
  <button type="button" onclick="location.reload()">再読み込み</button>
</main>
</body>
</html>
